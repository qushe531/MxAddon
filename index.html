<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXADDON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 8px;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff, 0 0 30px #00aaff;
            }
            to {
                text-shadow: 0 0 20px #ff00aa, 0 0 30px #ff00aa, 0 0 40px #ff00aa;
            }
        }

        .tagline {
            font-size: 1rem;
            color: #888;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .video-wrapper {
            position: relative;
            width: 560px;
            max-width: 90vw;
            aspect-ratio: 16/9;
            border: 2px solid #00aaff;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .video-wrapper:hover {
            transform: scale(1.03);
            box-shadow: 0 0 50px rgba(0, 170, 255, 0.7);
        }

        .play-btn {
            width: 80px;
            height: 80px;
            background: rgba(0, 170, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .play-btn::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 28px;
            border-color: transparent transparent transparent #fff;
            margin-left: 5px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .subtitle {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #aaa;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #555;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(0, 170, 255, 0.25);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body onclick="goToBilibili()">
    <!-- 背景动画 -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- 主内容 -->
    <div class="container">
        <h1>MXADDON</h1>
        <p class="tagline">PREMIUM RESOURCE LOADER</p>
        <div class="video-wrapper">
            <div class="play-btn"></div>
        </div>
        <p class="subtitle">Loading exclusive content...</p>
        <p class="hint"> 点击任意位置开始加载</p>
    </div>

    <script>
        // B站视频地址（替换为你想要的视频BV号）
        const bilibiliUrl = 'https://www.bilibili.com/video/BV1GJ411x7h7?t=59.1';

        function goToBilibili() {
            window.location.href = bilibiliUrl;
        }

        // 生成背景粒子动画
        const bgAnimation = document.getElementById('bgAnimation');
        for (let i = 0; i < 30; i++) {
            const span = document.createElement('span');
            span.style.left = Math.random() * 100 + '%';
            span.style.animationDuration = (Math.random() * 5 + 3) + 's';
            span.style.animationDelay = Math.random() * 5 + 's';
            span.style.width = (Math.random() * 20 + 10) + 'px';
            span.style.height = span.style.width;
            span.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            bgAnimation.appendChild(span);
        }
    </script>
</body>
</html>
